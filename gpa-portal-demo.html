<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="light dark" />
<link rel="icon" href="data:," />
<title>GPA Portal Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#f7f8f7; --surface:#ffffff; --ink:#17211f; --ink2:#5a6b66; --line:#dde5e1;
    --teal:#0f4f4a; --teal2:#14665e; --gold:#c9a227; --soft:#eef3f1;
    /* table palette — soft pastels, dark readable text on every tint */
    --tbl-head:#d9ead3; --tbl-head-ink:#1d3320;
    --tbl-row:#d8f9ff; --tbl-hover:#bdeefc;
    --tbl-border:#c3d4bd;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1514; --surface:#16211f; --ink:#e9f0ed; --ink2:#a9bcb6; --line:#2a3d38; --soft:#1d2c29; --teal:#123f3b;
      --tbl-head:#23402e; --tbl-head-ink:#e6f2e2;
      --tbl-row:#17333a; --tbl-hover:#1f4450;
      --tbl-border:#3a4f3c; }
  }
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;font-size:16px;line-height:1.5}
  a{color:var(--teal2)}
  @media (prefers-color-scheme: dark){ a{color:#7fd1c0} }
  .wrap{max-width:880px;margin:0 auto;padding:20px 16px 32px}
  /* header - small only */
  header{display:flex;align-items:center;gap:14px;padding:6px 0 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .logo{flex:none;display:block;height:56px;width:auto;max-width:180px;object-fit:contain;background:#fff;border-radius:6px;padding:4px 6px}
  .hname{line-height:1.15;min-width:0}
  .hname strong{display:block;font-size:19px;letter-spacing:.04em;line-height:1.2}
  .hname span{font-size:11px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  @media (max-width:560px){
    .logo{height:44px;max-width:132px;padding:3px 4px}
    .hname strong{font-size:16px}
    header{gap:10px}
  }
  .demo{margin-left:auto;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--gold);color:#241c02;padding:5px 9px;border-radius:999px}
  h1{font-size:22px;margin:20px 0 4px}
  .sub{margin:0;color:var(--ink2);font-size:14px}
  /* controls */
  .controls{display:flex;flex-wrap:wrap;gap:12px;margin:18px 0 14px;align-items:end}
  .field{display:flex;flex-direction:column;gap:6px;flex:1 1 260px}
  .field label{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
  .seg{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:4px;gap:4px}
  .seg button{flex:1;border:0;background:transparent;color:var(--ink2);font:inherit;font-weight:700;font-size:14px;padding:9px 4px;border-radius:7px;cursor:pointer;min-height:2.5rem}
  .seg button[aria-pressed="true"]{background:var(--teal2);color:#fff}
  select{font:inherit;font-weight:600;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);width:100%;min-height:2.5rem}
  .seg.view button{font-size:13.5px;padding-left:2px;padding-right:2px}
  /* table */
  .table-box{background:var(--surface);border:1px solid var(--tbl-border);border-radius:12px;overflow:hidden;margin-left:auto;margin-right:auto}
  table{border-collapse:collapse;width:100%;font-size:15px}
  th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line)}
  table th,table td{border-bottom-color:var(--tbl-border)}
  th{background:var(--tbl-head);color:var(--tbl-head-ink);font-size:13px;letter-spacing:.03em}
  /* one uniform very light cyan on every body row of every table */
  tbody td{background:var(--tbl-row)}
  tbody tr:hover td{background:var(--tbl-hover)}
  th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  tr:last-child td{border-bottom:0}
  td:first-child{color:var(--ink2);font-weight:600;width:52%}
  td.val{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
  .neg{color:#b3261e;font-weight:800}
  @media (prefers-color-scheme: dark){ .neg{color:#ff9d94} }
  .empty{padding:22px 16px;text-align:center;color:var(--ink2);font-size:14.5px;background:var(--surface);border:1px solid var(--tbl-border);border-radius:12px;margin-left:auto;margin-right:auto}
  .empty strong{display:block;color:var(--ink);margin-bottom:4px}
  /* teacher tables */
  .t-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin:26px 0 10px}
  .t-head h2{font-size:17px;margin:0}
  .t-counts{font-size:13.5px;color:var(--ink2);font-weight:700}
  .t-counts b.y{color:#14665e}.t-counts b.n{color:#b3261e}
  @media (prefers-color-scheme: dark){ .t-counts b.y{color:#7fd1c0}.t-counts b.n{color:#ff9d94} }
  .t-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
  .t-tools input{flex:1 1 180px;font:inherit;font-size:14px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:2.5rem}
  .chip{border:1px solid var(--line);background:var(--surface);color:var(--ink2);font:inherit;font-weight:700;font-size:13.5px;padding:8px 14px;border-radius:999px;cursor:pointer;min-height:2.5rem}
  .chip[aria-pressed="true"]{background:var(--teal2);border-color:var(--teal2);color:#fff}
  .t-box{background:var(--surface);border:1px solid var(--tbl-border);border-radius:12px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin:0 auto 8px}
  table.tt{font-size:14px}
  table.tt th,table.tt td{padding-left:10px;padding-right:10px}
  table.tt.wide{min-width:760px}
  table.tt td.cls{color:var(--ink2);font-weight:500;font-size:13px;min-width:150px}
  table.tt td.snum,table.tt th.snum{text-align:right;color:var(--ink2);font-weight:600}
  table.tt th{background:var(--tbl-head);color:var(--tbl-head-ink);font-size:12px;letter-spacing:.05em;text-transform:uppercase;border-bottom:1px solid var(--tbl-border)}
  table.tt td:first-child{color:var(--ink);font-weight:700;width:auto}
  table.tt td.subj{color:var(--ink2);font-weight:500;font-size:13px}
  table.tt td.num,table.tt th.num{text-align:right}
  .pill{display:inline-block;font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
  .pill.yes{background:transparent;color:#0d5c46}
  .pill.no{background:transparent;color:#a11f16}
  @media (prefers-color-scheme: dark){ .pill.yes{color:#7fd1c0}.pill.no{color:#ff9d94} }
  .dummy-banner{margin:0 0 12px;padding:10px 14px;border:1.5px dashed #b3261e;background:#fdf0ee;color:#7a1710;border-radius:10px;font-size:13.5px;font-weight:700;line-height:1.45}
  .dummy-banner strong{letter-spacing:.04em}
  @media (prefers-color-scheme: dark){ .dummy-banner{background:#3a1e1b;color:#ffb4ab;border-color:#ff9d94} }
  .dummy-tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.05em;background:#b3261e;color:#fff;padding:2px 8px;border-radius:999px;vertical-align:middle;margin-left:6px}
  .t-none{padding:16px;text-align:center;color:var(--ink2);font-size:14px}
  /* subject-class matrix */
  .sc-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table.sc{min-width:760px;font-size:13.5px}
  table.sc th{background:var(--tbl-head);color:var(--tbl-head-ink);font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;text-align:right;padding:9px 8px;white-space:nowrap}
  table.sc th:first-child{text-align:left}
  table.sc td{padding:9px 8px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.sc td:first-child{text-align:left;color:var(--ink);font-weight:700;width:auto}
  table.sc td.ov{font-weight:800}
  table.sc tr.tavg td{font-weight:800;border-top:2px solid var(--tbl-border)}
  .sc-hint{font-size:12.5px;color:var(--ink2);margin:0 0 8px}
  /* class-section table + status labels */
  table.tt tr.tavg td{font-weight:800;border-top:2px solid var(--tbl-border)}
  table.cs{min-width:760px}
  table.cs td.bl{font-size:12.5px;color:var(--ink2);min-width:140px;line-height:1.45}
  .st{font-weight:700;white-space:nowrap}
  .st.up{color:#0d5c46}.st.dn{color:#a11f16}.st.flat{color:var(--ink2)}
  @media (prefers-color-scheme: dark){ .st.up{color:#7fd1c0}.st.dn{color:#ff9d94} }
  @media (max-width:560px){ table.sc{font-size:12.5px} table.sc th,table.sc td{padding:7px 6px} }
  @media (max-width:560px){
    table.tt{font-size:13px}
    table.tt th,table.tt td{padding:9px 7px}
    table.tt td.subj{font-size:12px}
    .pill{padding:2px 7px;font-size:12px}
  }
  /* footer */
  footer{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}
  .note{margin:10px 0 0;font-size:13px;color:var(--ink2)}
  .credit{margin:10px 0 0;font-size:13.5px;font-weight:700;color:var(--ink)}
  .credit span{color:var(--ink2);font-weight:600}
</style>
</head>

  /* ================= LIVE DATA =================
     On every page load the Working Sheet of the Comparison Google Sheet is
     fetched (gviz feed, no sign-in needed) and every figure on this page is
     recomputed from those rows with the same formulas the Sheet uses:
     overview = pooled means, teacher Overall = mean of the term means,
     subject GPA = mean of the per-class means, Subject-Class Overall Avg =
     mean across the classes where the subject is taught, Class Section =
     pooled means per grade+section with the Sheet's Best/Lowest tie-breaks.
     If the fetch fails, the saved snapshot above stays on screen and a
     small note in the footer says so. */
  /*LIVE-COMPUTE-START*/
  var SHEET_ID = "1FKnv2J79AoBuJTyVySFUsIYwDurWHoMNb8WpRNmBnCg";
  var GVIZ_JSON_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&sheet=Working%20Sheet";
  var GVIZ_CSV_URL = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:csv&sheet=Working%20Sheet";
  var SUBJECT_ORDER = ["English","English Language","English Literature","Geography","Global History","ICT","Islamiyat","Maths","Naazrah","RTA","Science","Quran Translation","Social Studies","Urdu"];
  var GRADE_NUMS = ["4","5","6","7","8"];
  var GRADE_ROMAN = {"4":"IV","5":"V","6":"VI","7":"VII","8":"VIII"};

  function lr2(x){
    if(x === null || x === undefined || isNaN(x)) return null;
    var s = x < 0 ? -1 : 1;
    return s * Math.round((Math.abs(x) + 1e-9) * 100) / 100;
  }
  function lf2(x){ var v = lr2(x); return v === null ? "—" : v.toFixed(2); }
  function lfh(x){ var v = lr2(x); return v === null ? "-" : v.toFixed(2); }
  /* Delta rounding: plain half-up on the float, WITHOUT the +1e-9 epsilon —
     on exact-half cases the Sheet lands on the float side (e.g. Girls VII-C
     2025–2026 ClassSection delta is 0.00 in the Sheet, not -0.01). */
  function lr2d(x){
    if(x === null || x === undefined || isNaN(x)) return null;
    var s = x < 0 ? -1 : 1;
    var v = s * Math.round(Math.abs(x) * 100) / 100;
    return v === 0 ? 0 : v;
  }
  function lfd(x){ var v = lr2d(x); return v === null ? "-" : (v < 0 ? "−" : "") + Math.abs(v).toFixed(2); }
  function lfdS(x){ var v = lr2d(x); return v === null ? "-" : (v > 0 ? "+" : (v < 0 ? "−" : "")) + Math.abs(v).toFixed(2); }
  function ldelta(t1, t2){ return (t1 === null || t2 === null) ? null : t2 - t1; }
  function lsubjStatus(t1, t2){
    if(t1 === null) return "No T1 data";
    if(t2 === null) return "—";
    var d = t2 - t1;
    if(d >= 0.05) return "Improved";
    if(d <= -0.05) return "Decreased";
    return "Stable";
  }
  function lgradeStatus(t1, t2){
    if(t1 === null || t2 === null) return "—";
    var d = t2 - t1;
    if(d > 0) return "Improved";
    if(d < 0) return "Decreased";
    return "Stable";
  }
  function lfarqR(bo, go){
    if(bo === null || go === null) return "—";
    var d = lr2d(bo - go);
    if(d === 0) return "0";
    return (d > 0 ? "+" : "−") + Math.abs(d).toFixed(2);
  }
  var HELPER_ORDER = ["English","English Language","English Literature","Urdu","Maths","Science","Islamiyat","ICT","Social Studies","Global History","Geography","Naazrah","Quran Translation","RTA"];
  var SECTION_LETTERS = ["A","B","C","D","E"];
  function lmean(vals){
    var s = 0, n = 0, i;
    for(i = 0; i < vals.length; i++){
      if(vals[i] !== null && vals[i] !== undefined && !isNaN(vals[i])){ s += vals[i]; n++; }
    }
    return n ? s / n : null;
  }
  function lnum(v){
    if(v === null || v === undefined) return null;
    if(typeof v === "number") return isNaN(v) ? null : v;
    var t = String(v).trim();
    if(t === "") return null;
    var n = parseFloat(t);
    return isNaN(n) ? null : n;
  }
  function lsession(v){
    if(v === null || v === undefined) return "";
    return String(v).replace(/–/g, "-").replace(/\s+/g, "");
  }
  function lrows(rows){
    var out = [];
    rows.forEach(function(r){
      if(!/^\d{4}-\d{4}$/.test(r.sess)) return;
      if(r.branch !== "Girls" && r.branch !== "Boys") return;
      if(!r.subj) return;
      out.push(r);
    });
    return out;
  }
  function parseGvizJson(text){
    try{
      var i = text.indexOf("("), j = text.lastIndexOf(")");
      if(i < 0 || j <= i) return null;
      var obj = JSON.parse(text.slice(i + 1, j));
      if(!obj || !obj.table || !obj.table.rows) return null;
      var rows = [];
      obj.table.rows.forEach(function(r){
        var c = r.c || [];
        function v(k){ var cell = c[k]; return (cell === null || cell === undefined) ? null : cell.v; }
        var g = v(1);
        rows.push({
          sess: lsession(v(0)),
          grade: (typeof g === "number") ? String(Math.round(g)) : (g === null ? "" : String(g).trim()),
          sec: v(2) === null ? "" : String(v(2)).trim(),
          teacher: v(3) === null ? "" : String(v(3)),
          subj: v(4) === null ? "" : String(v(4)).trim(),
          t1: lnum(v(5)), t2: lnum(v(6)),
          branch: v(9) === null ? "" : String(v(9)).trim()
        });
      });
      return lrows(rows);
    }catch(e){ return null; }
  }
  function parseCsvText(text){
    var grid = [], row = [], field = "", inQ = false, i, ch;
    for(i = 0; i < text.length; i++){
      ch = text.charAt(i);
      if(inQ){
        if(ch === '"'){
          if(text.charAt(i + 1) === '"'){ field += '"'; i++; }
          else inQ = false;
        } else field += ch;
      }
      else if(ch === '"'){ inQ = true; }
      else if(ch === ","){ row.push(field); field = ""; }
      else if(ch === "\n"){ row.push(field); field = ""; grid.push(row); row = []; }
      else if(ch !== "\r"){ field += ch; }
    }
    if(field !== "" || row.length){ row.push(field); grid.push(row); }
    var rows = [];
    grid.forEach(function(c){
      function v(k){ return k < c.length ? c[k] : ""; }
      rows.push({
        sess: lsession(v(0)),
        grade: String(v(1)).trim(),
        sec: String(v(2)).trim(),
        teacher: String(v(3)),
        subj: String(v(4)).trim(),
        t1: lnum(v(5)), t2: lnum(v(6)),
        branch: String(v(9)).trim()
      });
    });
    return lrows(rows);
  }
  function buildDB(rows){
    var out = { teachers:{girls:{},boys:{}}, single:{girls:{},boys:{}}, compare:{}, subjects:{girls:{},boys:{}}, grades:{girls:{},boys:{}}, subjclass:{girls:{},boys:{}}, classsec:{girls:{},boys:{}} };
    var sessSet = {}, sessions = [];
    rows.forEach(function(r){ if(!sessSet[r.sess]){ sessSet[r.sess] = 1; sessions.push(r.sess); } });
    sessions.sort();
    function cellMean(rs, subj, grade, key){
      var vals = [];
      rs.forEach(function(d){ if(d.subj === subj && d.grade === grade) vals.push(d[key]); });
      return lmean(vals);
    }
    var ovMap = { girls:{}, boys:{} };
    [["Girls","girls"],["Boys","boys"]].forEach(function(pair){
      var bname = pair[0], bkey = pair[1];
      sessions.forEach(function(sess){
        var rs = rows.filter(function(d){ return d.branch === bname && d.sess === sess; });
        if(!rs.length) return;
        /* teachers */
        var tch = {}, names = [];
        rs.forEach(function(d){
          var t = (d.teacher || "").replace(/\s+/g, " ").trim();
          if(t && t !== "—" && t !== "-"){
            if(!tch[t]){ tch[t] = []; names.push(t); }
            tch[t].push(d);
          }
        });
        names.sort();
        var tlist = [], met = 0;
        names.forEach(function(name){
          var trs = tch[name];
          var tt1 = lmean(trs.map(function(d){ return d.t1; }));
          var tt2 = lmean(trs.map(function(d){ return d.t2; }));
          var terms = [];
          if(tt1 !== null) terms.push(tt1);
          if(tt2 !== null) terms.push(tt2);
          var ov = lmean(terms);
          var seen = [];
          trs.forEach(function(d){ if(seen.indexOf(d.subj) === -1) seen.push(d.subj); });
          seen.sort(function(a, b){ return HELPER_ORDER.indexOf(a) - HELPER_ORDER.indexOf(b); });
          var pairSeen = {}, pairs = [];
          trs.forEach(function(d){
            var g = (d.grade || "").trim(), sc = (d.sec || "").trim();
            if(!g || !sc) return;
            var key = g + "-" + sc;
            if(!pairSeen[key]){ pairSeen[key] = 1; pairs.push({ g:parseInt(g, 10), s:sc, label:key }); }
          });
          pairs.sort(function(a, b){ if(a.g !== b.g) return a.g - b.g; return a.s < b.s ? -1 : (a.s > b.s ? 1 : 0); });
          var clsStr = pairs.map(function(p){ return p.label; }).join(", ");
          var y = (ov !== null && ov >= 3.40) ? 1 : 0;
          if(y) met++;
          tlist.push({ n:name, s:seen.join(", "), c:clsStr, nc:pairs.length, t1:lf2(tt1), t2:lf2(tt2), o:lf2(ov), y:y });
        });
        if(tlist.length) out.teachers[bkey][sess] = tlist;
        /* overview */
        var allVals = [];
        rs.forEach(function(d){ allVals.push(d.t1); allVals.push(d.t2); });
        var ovAll = lmean(allVals);
        var t1m = lmean(rs.map(function(d){ return d.t1; }));
        var t2m = lmean(rs.map(function(d){ return d.t2; }));
        var nt = tlist.length, trow, arow, brow;
        if(nt){ trow = String(nt); arow = met + " (" + lr2(100 * met / nt).toFixed(2) + "%)"; brow = String(nt - met); }
        else { trow = "—"; arow = "—"; brow = "—"; }
        out.single[bkey][sess] = { rows: [
          ["Overall GPA", lf2(ovAll)],
          ["Term 1 GPA", lf2(t1m)],
          ["Term 2 GPA", lf2(t2m)],
          ["Teachers", trow],
          ["At / above 3.40 target", arow],
          ["Below target", brow],
          ["Data records", String(rs.length)]
        ]};
        ovMap[bkey][sess] = { ov:lr2(ovAll), t1:lr2(t1m), t2:lr2(t2m), nt:nt, met:met, rec:rs.length };
        /* subject-wise: the 14 subjects, mean of the per-class means (raw —
           the renderers derive T1→T2, Status, Overall and Farq from these) */
        out.subjects[bkey][sess] = SUBJECT_ORDER.map(function(s){
          var cm1 = GRADE_NUMS.map(function(g){ return cellMean(rs, s, g, "t1"); });
          var cm2 = GRADE_NUMS.map(function(g){ return cellMean(rs, s, g, "t2"); });
          return [s, lmean(cm1), lmean(cm2)];
        });
        /* grade-wise: classes IV–VIII, pooled means (raw) */
        out.grades[bkey][sess] = GRADE_NUMS.map(function(g){
          var gr = rs.filter(function(d){ return d.grade === g; });
          return [GRADE_ROMAN[g],
            lmean(gr.map(function(d){ return d.t1; })),
            lmean(gr.map(function(d){ return d.t2; }))];
        });
        /* subject-class matrix */
        var scrows = [], ovs1 = [], ovs2 = [];
        SUBJECT_ORDER.forEach(function(s){
          var row = [s], cm1 = [], cm2 = [];
          GRADE_NUMS.forEach(function(g){
            var a = cellMean(rs, s, g, "t1"), b = cellMean(rs, s, g, "t2");
            cm1.push(a); cm2.push(b);
            row.push(lfh(a)); row.push(lfh(b));
          });
          var o1 = lmean(cm1), o2 = lmean(cm2);
          ovs1.push(o1); ovs2.push(o2);
          row.push(lfh(o1)); row.push(lfh(o2));
          scrows.push(row);
        });
        var tavg = ["T.Avg"];
        GRADE_NUMS.forEach(function(g){
          tavg.push(lfh(lmean(SUBJECT_ORDER.map(function(s){ return cellMean(rs, s, g, "t1"); }))));
          tavg.push(lfh(lmean(SUBJECT_ORDER.map(function(s){ return cellMean(rs, s, g, "t2"); }))));
        });
        tavg.push(lfh(lmean(ovs1))); tavg.push(lfh(lmean(ovs2)));
        out.subjclass[bkey][sess] = { rows: scrows, tAvg: tavg };
        /* class-section performance: pooled term means per grade+section;
           Best/Lowest take the top/bottom two subjects by their T2 mean,
           ties broken by the Sheet's helper epsilon (later subject in
           HELPER_ORDER wins for Best, earlier wins for Lowest); Class Rank
           ranks the section's T2 inside its own class, ties share the rank */
        var csrows = [];
        GRADE_NUMS.forEach(function(g){
          var secs = SECTION_LETTERS.map(function(s){
            var srs = rs.filter(function(d){ return d.grade === g && d.sec === s; });
            var st1 = lmean(srs.map(function(d){ return d.t1; }));
            var st2 = lmean(srs.map(function(d){ return d.t2; }));
            var cand = [];
            HELPER_ORDER.forEach(function(subj, idx){
              var v = lmean(srs.filter(function(d){ return d.subj === subj; }).map(function(d){ return d.t2; }));
              if(v !== null) cand.push({ n: subj, v: v, e: v + (idx + 1) / 1000000 });
            });
            var best = "—", lowest = "—";
            if(cand.length){
              var desc = cand.slice().sort(function(a, b){ return b.e - a.e; });
              var asc = cand.slice().sort(function(a, b){ return a.e - b.e; });
              best = desc.slice(0, 2).map(function(c){ return c.n + "(" + lf2(c.v) + ")"; }).join(",");
              lowest = asc.slice(0, 2).map(function(c){ return c.n + "(" + lf2(c.v) + ")"; }).join(",");
            }
            return { cls: GRADE_ROMAN[g], sec: s, t1: st1, t2: st2, n: srs.length, best: best, lowest: lowest };
          });
          secs.forEach(function(sd){
            var rank = sd.t2 === null ? "—" : String(1 + secs.filter(function(o){ return o.t2 !== null && o.t2 > sd.t2; }).length);
            csrows.push([sd.cls, sd.sec, sd.t1, sd.t2, sd.n, sd.best, sd.lowest, rank]);
          });
        });
        out.classsec[bkey][sess] = csrows;
      });
    });
    /* compare (Farq = Boys − Girls, from the rounded branch figures) */
    sessions.forEach(function(sess){
      var g = ovMap.girls[sess], b = ovMap.boys[sess];
      if(!g || !b) return;
      function fd(bb, aa){
        if(bb === null || aa === null) return "—";
        var d = lr2(bb - aa);
        if(d === 0) return "0";
        return (d > 0 ? "+" : "−") + Math.abs(d).toFixed(2);
      }
      function cd(bb, aa){
        var d = bb - aa;
        if(d === 0) return "0";
        return (d > 0 ? "+" : "−") + String(Math.abs(d));
      }
      function nstr(o){ return o.nt ? String(o.nt) : "—"; }
      function astr(o){ return o.nt ? (o.met + " (" + lr2(100 * o.met / o.nt).toFixed(2) + "%)") : "—"; }
      out.compare[sess] = { rows: [
        ["Overall GPA", g.ov === null ? "—" : g.ov.toFixed(2), b.ov === null ? "—" : b.ov.toFixed(2), fd(b.ov, g.ov)],
        ["Term 1 GPA", g.t1 === null ? "—" : g.t1.toFixed(2), b.t1 === null ? "—" : b.t1.toFixed(2), fd(b.t1, g.t1)],
        ["Term 2 GPA", g.t2 === null ? "—" : g.t2.toFixed(2), b.t2 === null ? "—" : b.t2.toFixed(2), fd(b.t2, g.t2)],
        ["Teachers", nstr(g), nstr(b), (g.nt && b.nt) ? cd(b.nt, g.nt) : "—"],
        ["At / above 3.40", astr(g), astr(b), (g.nt && b.nt) ? cd(b.met, g.met) : "—"],
        ["Data records", String(g.rec), String(b.rec), cd(b.rec, g.rec)]
      ]};
    });
    return out;
  }
  /*LIVE-COMPUTE-END*/
  function adoptLive(rows){
    if(!rows || rows.length < 100) return false;
    var live = buildDB(rows);
    if(!live.single.girls["2025-2026"] || !live.single.boys["2025-2026"]) return false;
    DB = live;
    render();
    return true;
  }
  function fetchText(url){
    return new Promise(function(resolve, reject){
      if(typeof fetch !== "function"){ reject(new Error("no fetch")); return; }
      var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      var timer = null;
      if(ctrl) timer = setTimeout(function(){ ctrl.abort(); }, 20000);
      fetch(url, { cache: "no-store", signal: ctrl ? ctrl.signal : undefined }).then(function(res){
        if(timer) clearTimeout(timer);
        if(!res.ok) throw new Error("http " + res.status);
        return res.text();
      }).then(resolve, reject);
    });
  }
  function loadLive(){
    fetchText(GVIZ_JSON_URL).then(function(text){
      if(adoptLive(parseGvizJson(text))) return;
      throw new Error("json feed not usable");
    }).catch(function(){
      return fetchText(GVIZ_CSV_URL).then(function(text){
        if(adoptLive(parseCsvText(text))) return;
        throw new Error("csv feed not usable");
      });
    }).catch(function(){
      var n = document.getElementById("liveNote");
      if(n){ n.textContent = "Live data could not be loaded, so the last saved figures are shown."; n.style.display = ""; }
    });
  }

  render();
  loadLive();
})();
</script>
